[package]
name = "quire-reader"
version = "0.12.0"
description = "A personal EPUB reader"
authors = ["Quire contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "quire_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
tokio = { version = "1", features = ["sync", "fs", "macros", "time"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }

tauri-plugin-dialog = "2"
tauri-plugin-privacy = { path = "plugins/privacy" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-openssl"] }

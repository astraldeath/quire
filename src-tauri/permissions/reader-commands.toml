[[permission]]
identifier = "allow-reader-commands"
description = "Use the reader's native storage, file handling, window, privacy, sync, tracking, and update commands."
commands.allow = [
  "opds_credentials",
  "opds_fetch",
  "opds_cancel",
  "opds_account_call",
  "book_file_abort",
  "book_file_append",
  "book_file_begin",
  "book_file_finish",
  "book_file_read",
  "book_file_remove",
  "book_file_size",
  "desktop_default_apps",
  "desktop_file_platform",
  "desktop_open_pending",
  "desktop_open_read",
  "desktop_open_release",
  "desktop_window",
  "export_backup",
  "export_epub",
  "prepare_library",
  "privacy_call",
  "screen_capture",
  "statistics_call",
  "sync_call",
  "sync_discover",
  "sync_download_file",
  "sync_files",
  "sync_libraries",
  "sync_login",
  "sync_logout",
  "sync_metadata",
  "sync_upload_file",
  "tracking_connect",
  "tracking_disconnect",
  "tracking_provider",
  "tracking_status",
  "updates_call",
  "system_fonts",
  "updates_latest",
  "updates_info",
  "updates_restart",
]

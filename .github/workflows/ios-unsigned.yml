name: Unsigned iOS device app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Install Rust device target
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
          rustup target add aarch64-apple-ios
          xcodebuild -version
      - name: Restore Rust dependencies and compilation
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/**/deps
            src-tauri/target/**/build
            src-tauri/target/**/.fingerprint
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-1.95.0-aarch64-apple-ios-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-1.95.0-aarch64-apple-ios-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - name: Verify frontend
        run: npm test
      - name: Verify iOS asset installation
        run: python3 scripts/test-ios-assets.py
      - name: Generate Xcode project
        run: npx tauri ios init --ci
      - name: Install Quire app icons and privacy wordmark
        run: python3 scripts/ios-icons.py
      - name: Build unsigned physical-device IPA
        run: npx tauri ios build --ci --target aarch64 --no-sign
      - name: Save Rust dependencies and compilation
        if: github.repository == 'astraldeath/quire' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/**/deps
            src-tauri/target/**/build
            src-tauri/target/**/.fingerprint
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Check unsigned package
        run: python3 scripts/ios-verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Quire-unsigned-ios
          path: src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Clean generated device artifacts
        if: always()
        run: python3 scripts/ios-verify.py --clean

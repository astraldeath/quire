name: Publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable version tag to release (for example v0.2.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  windows:
    if: github.repository == 'astraldeath/quire'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate version and release notes
        shell: pwsh
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { releaseVersion, releaseNotes } from "./scripts/release-manifest.mjs"; const config = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8")); releaseVersion(config.version, process.env.RELEASE_TAG); releaseNotes(readFileSync("CHANGELOG.md", "utf8"), config.version); if (!config.plugins?.updater?.pubkey) throw new Error("The updater public key is not configured.");'
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata validation failed.' }
      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Configure the TAURI_SIGNING_PRIVATE_KEY repository Actions secret before releasing. See docs/UPDATES.md.'
          }
      - run: npm ci
      - run: npm run format:check
      - run: npm test -- --maxWorkers=2
      - run: node --test scripts/release-manifest.test.mjs scripts/release-assets.test.mjs
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: rustup override set 1.95.0
      - run: rustup target add x86_64-pc-windows-msvc
      - name: Restore Rust dependencies and compilation
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/**/deps
            src-tauri/target/**/build
            src-tauri/target/**/.fingerprint
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-1.95.0-x86_64-pc-windows-msvc-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-1.95.0-x86_64-pc-windows-msvc-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build signed Windows updater installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":true}}' | Set-Content -LiteralPath updater-build.json -Encoding utf8
          npx tauri build --ci --target x86_64-pc-windows-msvc --bundles nsis --config updater-build.json
          if ($LASTEXITCODE -ne 0) { throw 'Signed updater build failed.' }
      - name: Save Rust dependencies and compilation
        if: github.repository == 'astraldeath/quire' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/**/deps
            src-tauri/target/**/build
            src-tauri/target/**/.fingerprint
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Generate updater feed from signed artifacts
        shell: pwsh
        run: node scripts/release-manifest.mjs $env:RELEASE_TAG src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis release-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  android:
    if: github.repository == 'astraldeath/quire'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Configure Android toolchain
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Restore Rust dependencies and compilation
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/**/deps
            src-tauri/target/**/build
            src-tauri/target/**/.fingerprint
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-1.95.0-android-ndk28.0.13004108-all-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-1.95.0-android-ndk28.0.13004108-all-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - run: npx tauri android init --ci
      - name: Install Quire Android icons
        run: cp -R src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
      - name: Restore Gradle dependencies
        id: gradle-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk17-android36-${{ hashFiles('package-lock.json', 'src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk17-android36-${{ hashFiles('package-lock.json', 'src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties') }}-
      # The plugin writes the generated Android manifest from its build script.
      # A restored Cargo result must not skip registration in a fresh project.
      - name: Refresh generated Android deep links
        run: cargo clean --manifest-path src-tauri/Cargo.toml --package tauri-plugin-deep-link
      - run: npx tauri android build --ci --apk
      - name: Save Rust dependencies and compilation
        if: github.repository == 'astraldeath/quire' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/**/deps
            src-tauri/target/**/build
            src-tauri/target/**/.fingerprint
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Save Gradle dependencies
        if: github.repository == 'astraldeath/quire' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing Android keystore secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing Android keystore password}"
          : "${ANDROID_KEY_ALIAS:?Missing Android key alias}"
          : "${ANDROID_KEY_PASSWORD:?Missing Android key password}"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quire-android.jks"
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p release-artifacts
          output="release-artifacts/Quire_${version}_android.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -f -P 16 4 "${apks[0]}" "$RUNNER_TEMP/quire-aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/quire-android.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "$output" "$RUNNER_TEMP/quire-aligned.apk"
          "$tools/apksigner" verify --verbose "$output"
          "$tools/zipalign" -c -P 16 4 "$output"
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/quire-android.jks" "$RUNNER_TEMP/quire-aligned.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android
          path: release-artifacts/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    if: github.repository == 'astraldeath/quire'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Rust device target
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
          rustup target add aarch64-apple-ios
      - name: Restore Rust dependencies and compilation
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/**/deps
            src-tauri/target/**/build
            src-tauri/target/**/.fingerprint
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-1.95.0-aarch64-apple-ios-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-1.95.0-aarch64-apple-ios-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - run: python3 scripts/test-ios-assets.py
      - run: npx tauri ios init --ci
      - run: python3 scripts/ios-icons.py
      - run: npx tauri ios build --ci --target aarch64 --no-sign
      - name: Save Rust dependencies and compilation
        if: github.repository == 'astraldeath/quire' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/**/deps
            src-tauri/target/**/build
            src-tauri/target/**/.fingerprint
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - run: python3 scripts/ios-verify.py
      - name: Collect unsigned IPA
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil
          version = json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text())['version']
          ipas = list(pathlib.Path('src-tauri/gen/apple/build').rglob('*.ipa'))
          assert len(ipas) == 1, 'Expected exactly one IPA'
          pathlib.Path('release-artifacts').mkdir()
          shutil.copyfile(ipas[0], f'release-artifacts/Quire_{version}_ios-unsigned.ipa')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-ios
          path: release-artifacts/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Clean generated device artifacts
        if: always()
        run: python3 scripts/ios-verify.py --clean

  linux:
    if: github.repository == 'astraldeath/quire'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 libdbus-1-dev
      - run: npm ci
      - name: Install Rust target
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
          rustup target add x86_64-unknown-linux-gnu
      - name: Restore Rust dependencies and compilation
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/**/deps
            src-tauri/target/**/build
            src-tauri/target/**/.fingerprint
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu22.04-1.95.0-x86_64-unknown-linux-gnu-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu22.04-1.95.0-x86_64-unknown-linux-gnu-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build signed AppImage and Debian package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${TAURI_SIGNING_PRIVATE_KEY:?Missing updater signing key}"
          printf '%s' '{"bundle":{"createUpdaterArtifacts":true}}' > updater-build.json
          npx tauri build --ci --target x86_64-unknown-linux-gnu --bundles appimage,deb --config updater-build.json
      - name: Collect Linux packages
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil
          version = json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text())['version']
          root = pathlib.Path('src-tauri/target/x86_64-unknown-linux-gnu/release/bundle')
          output = pathlib.Path('release-artifacts')
          output.mkdir()
          for folder, extension, suffix in [('appimage', '.AppImage', 'linux_x86_64.AppImage'), ('deb', '.deb', 'linux_amd64.deb')]:
              files = list((root / folder).glob('*' + extension))
              assert len(files) == 1 and files[0].stat().st_size > 0, f'Expected one nonempty {extension}'
              destination = output / f'Quire_{version}_{suffix}'
              shutil.copyfile(files[0], destination)
              if extension == '.AppImage':
                  signature = pathlib.Path(str(files[0]) + '.sig')
                  assert signature.stat().st_size > 0, 'Missing AppImage signature'
                  shutil.copyfile(signature, str(destination) + '.sig')
          PY
      - name: Save Rust dependencies and compilation
        if: github.repository == 'astraldeath/quire' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/**/deps
            src-tauri/target/**/build
            src-tauri/target/**/.fingerprint
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [windows, android, ios, linux]
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Sign mobile downloads for the release feed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Missing updater signing key.' }
          $mobileAssets = @(Get-ChildItem -LiteralPath release-artifacts -File | Where-Object { $_.Extension -in '.apk', '.ipa' })
          if ($mobileAssets.Count -ne 2) { throw 'Expected one APK and one IPA.' }
          foreach ($asset in $mobileAssets) {
            npx --no-install tauri signer sign $asset.FullName
            if ($LASTEXITCODE -ne 0) { throw "Could not sign $($asset.Name)." }
          }
      - name: Validate complete downloads and write checksums
        run: node scripts/release-assets.mjs release-artifacts
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'This release is already published. Publish a new version instead of replacing signed assets.' }
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "Quire $env:RELEASE_TAG" --notes-file release-artifacts/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft.' }
          }
          $assets = @(Get-ChildItem -LiteralPath release-artifacts -File | Where-Object { $_.Name -ne 'release-notes.md' } | ForEach-Object { $_.FullName })
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload all signed release assets; release remains a draft.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest --notes-file release-artifacts/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the completed release.' }

name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable version tag to release (for example v0.2.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'astraldeath/quire'
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate version and release notes
        shell: pwsh
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { releaseVersion, releaseNotes } from "./scripts/release-manifest.mjs"; const config = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8")); releaseVersion(config.version, process.env.RELEASE_TAG); releaseNotes(readFileSync("CHANGELOG.md", "utf8"), config.version); if (!config.plugins?.updater?.pubkey) throw new Error("The updater public key is not configured.");'
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata validation failed.' }
      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Configure the TAURI_SIGNING_PRIVATE_KEY repository Actions secret before releasing. See docs/UPDATES.md.'
          }
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: node --test scripts/release-manifest.test.mjs
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: rustup override set 1.95.0
      - run: rustup target add x86_64-pc-windows-msvc
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build signed Windows updater installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":true}}' | Set-Content -LiteralPath updater-build.json -Encoding utf8
          npx tauri build --ci --target x86_64-pc-windows-msvc --bundles nsis --config updater-build.json
          if ($LASTEXITCODE -ne 0) { throw 'Signed updater build failed.' }
      - name: Generate updater feed from signed artifacts
        shell: pwsh
        run: node scripts/release-manifest.mjs $env:RELEASE_TAG src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis release-artifacts
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'This release is already published. Publish a new version instead of replacing signed assets.' }
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "Quire $env:RELEASE_TAG" --notes-file release-artifacts/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft.' }
          }
          $assets = @(Get-ChildItem -LiteralPath release-artifacts -File | Where-Object { $_.Name -ne 'release-notes.md' } | ForEach-Object { $_.FullName })
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload all signed release assets; release remains a draft.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest --notes-file release-artifacts/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the completed release.' }

name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - name: Verify release manifest generation
        run: node --test scripts/release-manifest.test.mjs scripts/release-assets.test.mjs
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: rustup override set 1.95.0
      - name: Restore Rust dependencies and compilation
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/**/deps
            src-tauri/target/**/build
            src-tauri/target/**/.fingerprint
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-1.95.0-x86_64-pc-windows-msvc-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-1.95.0-x86_64-pc-windows-msvc-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npx tauri build --ci --no-bundle
      - name: Save Rust dependencies and compilation
        if: github.repository == 'astraldeath/quire' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/**/deps
            src-tauri/target/**/build
            src-tauri/target/**/.fingerprint
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
